allowBuilds:
  unrs-resolver: false
  prisma: true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  '@parcel/watcher': set this to true or false
# Security fixes for transitive dependencies that Nest 11 / Express 5.2 pin
# to vulnerable versions (pnpm audit, October 2026). Drop once upstream
# ranges include the fixes.
overrides:
  body-parser: ^2.4.0
  fast-uri: ^3.1.9
  multer: ^2.5.0
  proxy-addr: ^2.0.8
