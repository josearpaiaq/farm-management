# Production stack for a single server (AWS Lightsail): the app image plus
# Caddy for HTTPS. The database is external (Neon), set via DATABASE_URL.
# Run from this directory: docker compose up -d --build
services:
  app:
    build:
      context: ..
    env_file: .env
    environment:
      # One proxy hop (Caddy) in front of the app.
      TRUST_PROXY: 1
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  # Holds the TLS certificates; keep it so they aren't re-issued on restart.
  caddy-data:
  caddy-config:
