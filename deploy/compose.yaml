# Production stack for a single server (AWS Lightsail): the app image plus
# Caddy for HTTPS. The database is external (Neon), set via DATABASE_URL.
# Run from this directory: docker compose pull && docker compose up -d
services:
  app:
    # Built and pushed by GitHub Actions (.github/workflows/ci.yml) on every
    # push to main. APP_TAG=sha-<commit> in .env pins an earlier build.
    image: ghcr.io/josearpaiaq/farm-management:${APP_TAG:-latest}
    # Fallback: `docker compose up -d --build` builds it on the server.
    build:
      context: ..
    env_file: .env
    environment:
      # One proxy hop (Caddy) in front of the app.
      TRUST_PROXY: 1
      # Links in emails point at the public site.
      APP_URL: https://${DOMAIN}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  # Holds the TLS certificates; keep it so they aren't re-issued on restart.
  caddy-data:
  caddy-config:
