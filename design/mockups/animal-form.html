<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animal Form — Farm Management</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: var(--font-size-base);
    background: var(--bg);
    color: var(--text-primary);
  }

  .icon { width: 1.1em; height: 1.1em; flex-shrink: 0; }

  .shell { display: flex; min-height: 100vh; }

  .sidebar {
    width: 220px;
    background: var(--accent-dark);
    color: var(--bg);
    padding: 24px 16px;
    flex-shrink: 0;
  }
  .sidebar .brand { font-weight: 700; font-size: 1.1rem; margin-bottom: 24px; display: flex; align-items: center; gap: 8px; }
  .sidebar nav { display: flex; flex-direction: column; gap: 4px; }
  .sidebar .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 8px; text-decoration: none;
    color: var(--bg); opacity: 0.75; font-size: 0.95rem;
  }
  .sidebar .nav-item.active {
    background: rgba(253, 246, 236, 0.15); opacity: 1; font-weight: 600;
  }

  .main { flex: 1; padding: 24px; max-width: 560px; }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 0.85rem;
    margin-bottom: 12px;
  }

  h2 { margin: 0 0 4px 0; font-size: 1.2rem; }
  .form-subtitle {
    font-size: 0.85rem;
    color: var(--text-secondary);
    margin-bottom: 20px;
  }

  .section-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    color: var(--text-secondary);
    font-weight: 600;
    margin: 20px 0 10px 0;
  }
  .section-label:first-of-type { margin-top: 0; }

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .field input,
  .field select {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-primary);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.9rem;
    font-family: inherit;
  }
  .field .hint {
    font-size: 0.75rem;
    color: var(--text-secondary);
    margin-top: 4px;
  }
  .field.required label::after {
    content: " *";
    color: var(--status-danger);
  }

  .form-actions {
    display: flex;
    gap: 10px;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }

  .btn-primary {
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .btn-secondary {
    background: var(--surface);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 0.95rem;
    cursor: pointer;
    text-decoration: none;
  }

  @media (max-width: 767px) {
    .sidebar { display: none; }
    .main { max-width: none; }
    .field-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.4 13.7A6.5 6.5 0 1 0 6.28 6.6c-1.1 3.13-.78 3.9-3.18 6.08A3 3 0 0 0 5 18c4 0 8.4-1.8 11.4-4.3"/><path d="m18.5 6 2.19 4.5a6.48 6.48 0 0 1-2.29 7.2C15.4 20.2 11 22 7 22a3 3 0 0 1-2.68-1.66L2.4 16.5"/><circle cx="12.5" cy="8.5" r="2.5"/></svg> Farm Mgmt</div>
      <nav>
        <a class="nav-item active" href="animals-list.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.4 13.7A6.5 6.5 0 1 0 6.28 6.6c-1.1 3.13-.78 3.9-3.18 6.08A3 3 0 0 0 5 18c4 0 8.4-1.8 11.4-4.3"/><path d="m18.5 6 2.19 4.5a6.48 6.48 0 0 1-2.29 7.2C15.4 20.2 11 22 7 22a3 3 0 0 1-2.68-1.66L2.4 16.5"/><circle cx="12.5" cy="8.5" r="2.5"/></svg> Animals</a>
        <a class="nav-item" href="farms-list.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 21V10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1v11"/><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 1.132-1.803l7.95-3.974a2 2 0 0 1 1.837 0l7.948 3.974A2 2 0 0 1 22 8z"/><path d="M6 13h12"/><path d="M6 17h12"/></svg> Farms</a>
        <a class="nav-item" href="#"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h4"/><path d="M2 10h4"/><path d="M2 14h4"/><path d="M2 18h4"/><rect width="16" height="20" x="4" y="2" rx="2"/><path d="M9.5 8h5"/><path d="M9.5 12H16"/><path d="M9.5 16H14"/></svg> Notes</a>
      </nav>
    </aside>

    <div class="main">
      <a class="back-link" href="animals-list.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> Back to Animals</a>
      <h2>New Animal</h2>
      <div class="form-subtitle">Fields marked * are required to save.</div>

      <div class="section-label">Identity</div>
      <div class="field-row">
        <div class="field required">
          <label for="tag">Primary tag</label>
          <input id="tag" type="text" placeholder="e.g. A107">
        </div>
        <div class="field required">
          <label for="species">Species</label>
          <select id="species">
            <option>Cattle</option>
            <option>Sheep</option>
            <option>Goat</option>
            <option>Pig</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="breed">Breed</label>
          <select id="breed">
            <option>Angus</option>
            <option>Hereford</option>
            <option>Brahman</option>
          </select>
          <div class="hint">Options scoped to the selected species.</div>
        </div>
        <div class="field required">
          <label for="sex">Sex</label>
          <select id="sex">
            <option>Female</option>
            <option>Male</option>
          </select>
        </div>
      </div>

      <div class="section-label">Details</div>
      <div class="field-row">
        <div class="field">
          <label for="birth-date">Birth date</label>
          <input id="birth-date" type="date">
        </div>
        <div class="field required">
          <label for="tenure">Tenure</label>
          <select id="tenure">
            <option>Owned</option>
            <option>Leased</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="farm">Farm</label>
        <select id="farm">
          <option>Farm Norte</option>
          <option>Farm Sur</option>
          <option>Farm Este</option>
        </select>
      </div>

      <div class="section-label">Genealogy (optional)</div>
      <div class="field-row">
        <div class="field">
          <label for="sire">Sire (father)</label>
          <input id="sire" type="text" placeholder="Search by tag…" list="animal-tags">
          <div class="hint">Leave blank if unknown — cannot be added retroactively.</div>
        </div>
        <div class="field">
          <label for="dam">Dam (mother)</label>
          <input id="dam" type="text" placeholder="Search by tag…" list="animal-tags">
        </div>
      </div>
      <datalist id="animal-tags">
        <option value="A101">
        <option value="A102">
        <option value="A103">
      </datalist>

      <div class="form-actions">
        <button class="btn-primary" onclick="location.href='animals-list.html'">Save</button>
        <a class="btn-secondary" href="animals-list.html">Cancel</a>
      </div>
    </div>
  </div>
</body>
</html>
