<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farms — Farm Management</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: var(--font-size-base);
    background: var(--bg);
    color: var(--text-primary);
  }

  .icon { width: 1.1em; height: 1.1em; flex-shrink: 0; }

  .shell { display: flex; min-height: 100vh; }

  .sidebar {
    width: 220px;
    background: var(--accent-dark);
    color: var(--bg);
    padding: 24px 16px;
    flex-shrink: 0;
  }
  .sidebar .brand { font-weight: 700; font-size: 1.1rem; margin-bottom: 24px; display: flex; align-items: center; gap: 8px; }
  .sidebar nav { display: flex; flex-direction: column; gap: 4px; }
  .sidebar .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 8px; text-decoration: none;
    color: var(--bg); opacity: 0.75; font-size: 0.95rem;
  }
  .sidebar .nav-item.active {
    background: rgba(253, 246, 236, 0.15); opacity: 1; font-weight: 600;
  }

  .main { flex: 1; padding: 24px; }

  .list-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
  }
  .list-title { font-size: 1.1rem; font-weight: 700; }

  .btn-primary {
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 0.95rem;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .farms-table {
    width: 100%;
    border-collapse: collapse;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .farms-table th {
    text-align: left;
    font-size: 0.75rem;
    text-transform: uppercase;
    color: var(--text-secondary);
    background: var(--bg);
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
  }
  .farms-table td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
  }
  .farms-table tr:last-child td { border-bottom: none; }
  .farms-table a { color: var(--accent-dark); text-decoration: none; font-size: 0.85rem; }

  .farms-cards {
    display: none;
    flex-direction: column;
    gap: 10px;
  }
  .farm-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .farm-card .name { font-weight: 600; font-size: 0.95rem; }
  .farm-card .meta { font-size: 0.8rem; color: var(--text-secondary); }

  @media (max-width: 767px) {
    .sidebar { display: none; }
    .farms-table { display: none; }
    .farms-cards { display: flex; }
  }
</style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.4 13.7A6.5 6.5 0 1 0 6.28 6.6c-1.1 3.13-.78 3.9-3.18 6.08A3 3 0 0 0 5 18c4 0 8.4-1.8 11.4-4.3"/><path d="m18.5 6 2.19 4.5a6.48 6.48 0 0 1-2.29 7.2C15.4 20.2 11 22 7 22a3 3 0 0 1-2.68-1.66L2.4 16.5"/><circle cx="12.5" cy="8.5" r="2.5"/></svg> Farm Mgmt</div>
      <nav>
        <a class="nav-item" href="animals-list.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.4 13.7A6.5 6.5 0 1 0 6.28 6.6c-1.1 3.13-.78 3.9-3.18 6.08A3 3 0 0 0 5 18c4 0 8.4-1.8 11.4-4.3"/><path d="m18.5 6 2.19 4.5a6.48 6.48 0 0 1-2.29 7.2C15.4 20.2 11 22 7 22a3 3 0 0 1-2.68-1.66L2.4 16.5"/><circle cx="12.5" cy="8.5" r="2.5"/></svg> Animals</a>
        <a class="nav-item active" href="farms-list.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 21V10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1v11"/><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 1.132-1.803l7.95-3.974a2 2 0 0 1 1.837 0l7.948 3.974A2 2 0 0 1 22 8z"/><path d="M6 13h12"/><path d="M6 17h12"/></svg> Farms</a>
        <a class="nav-item" href="#"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h4"/><path d="M2 10h4"/><path d="M2 14h4"/><path d="M2 18h4"/><rect width="16" height="20" x="4" y="2" rx="2"/><path d="M9.5 8h5"/><path d="M9.5 12H16"/><path d="M9.5 16H14"/></svg> Notes</a>
      </nav>
    </aside>

    <div class="main">
      <div class="list-header">
        <div class="list-title">Farms · 3</div>
        <a class="btn-primary" href="farm-form.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg> New</a>
      </div>

      <table class="farms-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Location</th>
            <th>Animals</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Farm Norte</td>
            <td>Córdoba, AR</td>
            <td>28</td>
            <td><a href="farm-form.html">Edit</a></td>
          </tr>
          <tr>
            <td>Farm Sur</td>
            <td>Santa Fe, AR</td>
            <td>14</td>
            <td><a href="farm-form.html">Edit</a></td>
          </tr>
          <tr>
            <td>Farm Este</td>
            <td>Entre Ríos, AR</td>
            <td>0</td>
            <td><a href="farm-form.html">Edit</a></td>
          </tr>
        </tbody>
      </table>

      <div class="farms-cards">
        <div class="farm-card">
          <div>
            <div class="name">Farm Norte</div>
            <div class="meta">Córdoba, AR · 28 animals</div>
          </div>
          <a href="farm-form.html" style="color:var(--accent-dark);font-size:0.85rem;">Edit</a>
        </div>
        <div class="farm-card">
          <div>
            <div class="name">Farm Sur</div>
            <div class="meta">Santa Fe, AR · 14 animals</div>
          </div>
          <a href="farm-form.html" style="color:var(--accent-dark);font-size:0.85rem;">Edit</a>
        </div>
        <div class="farm-card">
          <div>
            <div class="name">Farm Este</div>
            <div class="meta">Entre Ríos, AR · 0 animals</div>
          </div>
          <a href="farm-form.html" style="color:var(--accent-dark);font-size:0.85rem;">Edit</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
