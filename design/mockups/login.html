<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — Farm Management</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: var(--font-size-base);
    background: var(--bg);
    color: var(--text-primary);
  }

  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    width: 100%;
    max-width: 360px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 1.15rem;
    color: var(--accent-dark);
    margin-bottom: 4px;
  }

  .tagline {
    font-size: 0.85rem;
    color: var(--text-secondary);
    margin-bottom: 24px;
  }

  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-primary);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.95rem;
    font-family: inherit;
  }

  .password-field {
    position: relative;
  }
  .password-field input {
    padding-right: 40px;
  }
  .password-toggle {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-secondary);
    padding: 4px;
    display: flex;
    align-items: center;
    font-size: 1rem;
  }

  .btn-primary {
    width: 100%;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 8px;
    padding: 12px 18px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }

  .footer-note {
    text-align: center;
    font-size: 0.8rem;
    color: var(--text-secondary);
    margin-top: 18px;
  }

  .icon {
    width: 1.1em;
    height: 1.1em;
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <div class="login-card">
    <div class="brand"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.4 13.7A6.5 6.5 0 1 0 6.28 6.6c-1.1 3.13-.78 3.9-3.18 6.08A3 3 0 0 0 5 18c4 0 8.4-1.8 11.4-4.3"/><path d="m18.5 6 2.19 4.5a6.48 6.48 0 0 1-2.29 7.2C15.4 20.2 11 22 7 22a3 3 0 0 1-2.68-1.66L2.4 16.5"/><circle cx="12.5" cy="8.5" r="2.5"/></svg> Farm Management</div>
    <div class="tagline">Sign in to manage your herd.</div>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@farm.com">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="password-field">
        <input id="password" type="password" placeholder="••••••••">
        <button type="button" class="password-toggle" onclick="togglePassword()" aria-label="Show password">
          <svg class="icon icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="icon icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
        </button>
      </div>
    </div>

    <button class="btn-primary" onclick="location.href='animals-list.html'">Sign in</button>

    <div class="footer-note">Contact your organization owner if you need access.</div>
  </div>

  <script>
    function togglePassword() {
      const input = document.getElementById('password');
      const btn = document.querySelector('.password-toggle');
      const eye = btn.querySelector('.icon-eye');
      const eyeOff = btn.querySelector('.icon-eye-off');
      const hidden = input.type === 'password';
      input.type = hidden ? 'text' : 'password';
      eye.style.display = hidden ? 'none' : '';
      eyeOff.style.display = hidden ? '' : 'none';
      btn.setAttribute('aria-label', hidden ? 'Hide password' : 'Show password');
    }
  </script>
</body>
</html>
