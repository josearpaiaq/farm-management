<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nav Shell — Farm Management</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: var(--font-size-base);
    background: var(--bg);
    color: var(--text-primary);
  }

  .shell {
    display: flex;
    min-height: 100vh;
  }

  /* --- Sidebar (desktop) / Drawer (mobile) --- */
  .sidebar {
    width: 220px;
    background: var(--accent-dark);
    color: var(--bg);
    padding: 24px 16px;
    flex-shrink: 0;
  }

  .icon {
    width: 1.1em;
    height: 1.1em;
    flex-shrink: 0;
  }

  .sidebar .brand {
    font-weight: 700;
    font-size: 1.1rem;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .sidebar nav {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .sidebar .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    text-decoration: none;
    color: var(--bg);
    opacity: 0.75;
    font-size: 0.95rem;
  }

  .sidebar .nav-item.active {
    background: rgba(253, 246, 236, 0.15);
    opacity: 1;
    font-weight: 600;
  }

  .main {
    flex: 1;
    padding: 24px;
  }

  .topbar {
    display: none;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .menu-trigger {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .placeholder-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    height: 28px;
    margin-top: 10px;
  }

  /* --- Drawer overlay (mobile only) --- */
  .drawer-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    opacity: 0;
    transition: opacity 220ms ease;
    z-index: 10;
  }

  .drawer-overlay.open {
    opacity: 1;
  }

  /* --- Responsive: below Tailwind's md (768px) --- */
  @media (max-width: 767px) {
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      transform: translateX(-100%);
      transition: transform 220ms ease;
      z-index: 20;
    }

    .sidebar.open {
      transform: translateX(0);
    }

    .topbar {
      display: flex;
    }

    .drawer-overlay {
      display: block;
    }
  }
</style>
</head>
<body>
  <div class="shell">
    <div class="drawer-overlay" id="overlay" onclick="closeDrawer()"></div>

    <aside class="sidebar" id="sidebar">
      <div class="brand"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.4 13.7A6.5 6.5 0 1 0 6.28 6.6c-1.1 3.13-.78 3.9-3.18 6.08A3 3 0 0 0 5 18c4 0 8.4-1.8 11.4-4.3"/><path d="m18.5 6 2.19 4.5a6.48 6.48 0 0 1-2.29 7.2C15.4 20.2 11 22 7 22a3 3 0 0 1-2.68-1.66L2.4 16.5"/><circle cx="12.5" cy="8.5" r="2.5"/></svg> Farm Mgmt</div>
      <nav>
        <a class="nav-item active" href="animals-list.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.4 13.7A6.5 6.5 0 1 0 6.28 6.6c-1.1 3.13-.78 3.9-3.18 6.08A3 3 0 0 0 5 18c4 0 8.4-1.8 11.4-4.3"/><path d="m18.5 6 2.19 4.5a6.48 6.48 0 0 1-2.29 7.2C15.4 20.2 11 22 7 22a3 3 0 0 1-2.68-1.66L2.4 16.5"/><circle cx="12.5" cy="8.5" r="2.5"/></svg> Animals</a>
        <a class="nav-item" href="#"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 21V10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1v11"/><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 1.132-1.803l7.95-3.974a2 2 0 0 1 1.837 0l7.948 3.974A2 2 0 0 1 22 8z"/><path d="M6 13h12"/><path d="M6 17h12"/></svg> Farms</a>
        <a class="nav-item" href="#"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h4"/><path d="M2 10h4"/><path d="M2 14h4"/><path d="M2 18h4"/><rect width="16" height="20" x="4" y="2" rx="2"/><path d="M9.5 8h5"/><path d="M9.5 12H16"/><path d="M9.5 16H14"/></svg> Notes</a>
      </nav>
    </aside>

    <div class="main">
      <div class="topbar">
        <button class="menu-trigger" onclick="openDrawer()"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/></svg> Menu</button>
        <strong>Animals</strong>
      </div>

      <h2 style="margin-top:0;">Animals</h2>
      <p style="color: var(--text-secondary); font-size: 0.9rem;">
        Nav shell mockup — resize below 768px to see the drawer. See
        animals-list.html for the actual list screen.
      </p>
      <div class="placeholder-block"></div>
      <div class="placeholder-block"></div>
    </div>
  </div>

  <script>
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');

    function openDrawer() {
      sidebar.classList.add('open');
      overlay.classList.add('open');
    }

    function closeDrawer() {
      sidebar.classList.remove('open');
      overlay.classList.remove('open');
    }
  </script>
</body>
</html>
